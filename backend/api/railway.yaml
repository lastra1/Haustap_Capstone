build:
  dockerfile: Dockerfile
  context: .

deploy:
  startCommand: php artisan serve --host=0.0.0.0 --port=8000
  healthcheckPath: /api/health
  restartPolicyType: ON_FAILURE
  restartPolicyMaxRetries: 10

environments:
  production:
    variables:
      - name: APP_NAME
        value: HausTap API
      - name: APP_ENV
        value: production
      - name: APP_DEBUG
        value: false
      - name: APP_URL
        value: ${RAILWAY_PUBLIC_DOMAIN}
      - name: DB_CONNECTION
        value: sqlite
      - name: SESSION_DRIVER
        value: database
      - name: CACHE_STORE
        value: database
      - name: QUEUE_CONNECTION
        value: database
      - name: BROADCAST_CONNECTION
        value: log
      - name: FILESYSTEM_DISK
        value: local
      - name: LOG_CHANNEL
        value: stderr
      - name: LOG_LEVEL
        value: info