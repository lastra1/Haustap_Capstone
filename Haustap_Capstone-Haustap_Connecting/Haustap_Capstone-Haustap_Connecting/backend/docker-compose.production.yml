# Production Docker Compose for Cloud Hosting
version: '3.8'

services:
  # Laravel API Backend
  laravel-api:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: haustap_laravel_api
    restart: unless-stopped
    environment:
      APP_NAME: "HausTap API"
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: ${APP_URL:-http://localhost:8000}
      
      # Database (use cloud database or external MySQL)
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-haustap_db}
      DB_USERNAME: ${DB_USERNAME:-haustap_user}
      DB_PASSWORD: ${DB_PASSWORD}
      
      # Firebase Configuration
      FIREBASE_PROJECT_ID: haustap-booking-system
      FIREBASE_CREDENTIALS_PATH: storage/app/firebase/service-account.json
      
      # Security
      APP_KEY: ${APP_KEY}
      JWT_SECRET: ${JWT_SECRET}
      
      # Cache/Session (use Redis for production)
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      
      # Logging
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    ports:
      - "8000:8000"
    networks:
      - haustap_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis Cache (use managed Redis for production)
  redis:
    image: redis:7-alpine
    container_name: haustap_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - haustap_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  haustap_network:
    driver: bridge

volumes:
  redis_data:
    driver: local