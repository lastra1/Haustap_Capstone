version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: haustap_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: haustap_db
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_PASSWORD: haustap_password
      MYSQL_USER: haustap_user
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
    ports:
      - "3306:3306"
    networks:
      - haustap_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: haustap_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - haustap_network

  # Laravel Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: haustap_backend
    restart: unless-stopped
    environment:
      APP_NAME: "HausTap Backend"
      APP_ENV: development
      APP_DEBUG: "true"
      APP_URL: http://localhost:8001
      
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: haustap_db
      DB_USERNAME: haustap_user
      DB_PASSWORD: haustap_password
      
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: null
      
      FIREBASE_PROJECT_ID: haustap-booking-system
      FIREBASE_CREDENTIALS_PATH: storage/app/firebase/service-account.json
      
      SOCKET_URL: http://localhost:3000
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - ./docker/supervisor/conf.d:/etc/supervisor/conf.d
    ports:
      - "8001:8000"
      - "9000:9000"
    depends_on:
      - mysql
      - redis
    networks:
      - haustap_network

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: haustap_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    depends_on:
      - backend
    networks:
      - haustap_network

  # PHPMyAdmin for Database Management
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: haustap_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: haustap_user
      PMA_PASSWORD: haustap_password
      PMA_ARBITRARY: 1
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - haustap_network

  # Node.js Socket Server for Real-time Notifications
  socket_server:
    image: node:18-alpine
    container_name: haustap_socket
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./socket-server:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm start"
    depends_on:
      - redis
      - mysql
    networks:
      - haustap_network

networks:
  haustap_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local