# Render.com Configuration
services:
  - type: web
    name: haustap-laravel-api
    env: docker
    dockerfilePath: ./Dockerfile.production
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://haustap-laravel-api.onrender.com
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false  # Set your database host
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false  # Set your database name
      - key: DB_USERNAME
        sync: false  # Set your database username
      - key: DB_PASSWORD
        sync: false  # Set your database password
      - key: FIREBASE_PROJECT_ID
        value: haustap-booking-system
      - key: FIREBASE_CREDENTIALS_PATH
        value: storage/app/firebase/service-account.json
      - key: REDIS_HOST
        sync: false  # Set your Redis host
      - key: REDIS_PORT
        value: "6379"
      - key: APP_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /api/health
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      composer require kreait/firebase-php --no-dev
      php artisan config:cache
      php artisan route:cache
    startCommand: php artisan serve --host=0.0.0.0 --port=8000
    disk:
      name: haustap-storage
      mountPath: /var/www/html/storage
      sizeGB: 10